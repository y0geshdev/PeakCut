<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeakCut - YouTube feeds prototype</title>
<style>
:root{--brand:#FF8B33;--soft:#FFF2E8;--ink:#2A1A12;--frame:#1E1612;--muted:#F7F4F1;--line:#EEE8E4;--text:#211813;--dim:#6D6159;--good:#0F8A57;--bad:#D3343F}
*{box-sizing:border-box}body{margin:0;background:var(--frame);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}a{color:#A9480A}h1,h2,h3,p{margin:0}h1{font-size:28px;letter-spacing:-.7px}h2{font-size:19px}h3{font-size:15px}:focus-visible{outline:2px solid var(--brand);outline-offset:3px}[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.sidebar{color:#F4EEEA;padding:26px 16px;display:flex;flex-direction:column;gap:28px}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand em{font-style:normal;color:var(--brand)}.sidebar p,.sidebar small{color:#A99A91}.nav-list{display:grid;gap:7px}.nav-list button{border:0;border-radius:8px;text-align:left;background:transparent;color:#F4EEEA;padding:11px 12px}.nav-list button:hover{background:#2C221D}.nav-list button.on{background:var(--brand);color:var(--ink);font-weight:600}.side-foot{margin-top:auto;border-top:1px solid #40342D;padding-top:18px;font-size:12px}
main{background:white;margin:8px 8px 8px 0;border-radius:16px;min-width:0}.prototype{padding:12px 28px;background:var(--soft);border-radius:16px 16px 0 0;border-bottom:1px solid #FFD9BC;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px}.prototype b{color:#A9480A}.prototype label{margin-left:auto;display:flex;gap:8px;align-items:center}.prototype select{padding:5px 8px;border:1px solid #E1D9D3;border-radius:6px;background:white}
.body{padding:28px;max-width:1280px;margin:auto}.heading,.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.heading{margin-bottom:24px}.eyebrow{font-size:12px;color:var(--dim);margin-bottom:5px}.sub{color:var(--dim);margin-top:6px}.btn{border:1px solid #E1D9D3;background:white;padding:9px 14px;border-radius:8px;font-weight:600;white-space:nowrap}.btn:hover{background:var(--muted)}.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--ink)}.btn.primary:hover{background:#F27A1F}.btn.quiet{font-weight:500}.btn.danger{color:var(--bad)}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:24px}.stat{border:1px solid var(--line);border-radius:12px;padding:18px}.stat strong{display:block;font-size:29px;margin-top:5px}.stat small{color:var(--dim)}.note{padding:13px 16px;background:var(--muted);border-radius:9px;color:var(--dim);margin-bottom:22px;font-size:13px}.note.warn{background:#FFF4E6;color:#7A3E0C}.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--muted);color:var(--dim)}.badge.good{background:#E6F6EE;color:var(--good)}.badge.bad{background:#FDECEE;color:var(--bad)}.badge.orange{background:var(--soft);color:#A9480A}
.feed{border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:14px}.identity{display:flex;gap:12px;align-items:center}.avatar{width:42px;height:42px;display:grid;place-items:center;background:var(--soft);color:#A9480A;border-radius:50%;font-weight:700;flex:none}.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0;color:var(--dim);font-size:12px}.meta strong{display:block;color:var(--text);font-size:14px;margin-top:4px}.feed-foot{border-top:1px solid var(--line);padding-top:15px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.empty{padding:54px 22px;text-align:center;border:1px dashed #E1D9D3;border-radius:12px}.empty .avatar{margin:0 auto 14px;width:58px;height:58px}.empty p{max-width:430px;margin:12px auto 22px;color:var(--dim)}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:24px}.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 0;color:var(--dim)}.tabs button.on{border-color:var(--brand);color:var(--text);font-weight:600}
.panel{border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}.two{display:grid;grid-template-columns:1.45fr 1fr;gap:22px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 24px}.steps span{font-size:12px;padding:7px 10px;border-radius:7px;background:var(--muted);color:var(--dim)}.steps .on{background:var(--soft);color:#A9480A}label.field{display:grid;gap:7px;margin-bottom:18px;font-weight:600}input[type=text],select.field-input{width:100%;padding:11px 12px;border:1px solid #E1D9D3;border-radius:8px;background:white;min-width:0}small.help{display:block;color:var(--dim);font-weight:400;margin-top:6px}.radio{display:flex;gap:10px;align-items:flex-start;padding:13px 0;cursor:pointer}.radio input{margin-top:5px;accent-color:var(--brand)}.radio span{display:block}.radio small{display:block;color:var(--dim)}.check{display:flex;align-items:flex-start;gap:9px;margin:18px 0;font-size:13px}.check input{margin-top:4px;accent-color:var(--brand)}.preview{background:var(--muted);border-radius:10px;padding:16px;margin:18px 0}.feed-url{font-family:monospace;font-size:12px;overflow-wrap:anywhere;color:var(--dim);margin-top:10px}.backlog{padding:10px 14px;background:var(--muted);border-radius:8px}.backlog label{display:flex;gap:8px;padding:7px 0}.backlog small{color:var(--dim)}.error{color:var(--bad);font-size:13px;margin:10px 0}.split{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filter{margin-bottom:15px}
.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:12px;color:var(--dim);font-weight:500;padding:12px 15px;background:var(--muted)}td{padding:16px 15px;border-bottom:1px solid var(--line);vertical-align:middle}td small{display:block;color:var(--dim);margin-top:4px}.activity-title{min-width:240px}.clips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.clip{border:1px solid var(--line);border-radius:12px;overflow:hidden}.poster{background:#2C221D;color:#F4EEEA;height:220px;display:grid;place-items:center;text-align:center;padding:22px}.poster-inner{border:1px solid #6D6159;padding:22px 13px;border-radius:8px;width:130px}.poster small{display:block;color:#A99A91;font-size:11px;margin-top:14px}.clip-body{padding:17px}.clip-body h3{margin:10px 0}.clip-body p{font-size:12px;color:var(--dim);margin-bottom:15px}.footer{color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:16px;margin-top:26px}.toast{position:fixed;bottom:24px;right:24px;max-width:min(430px,calc(100vw - 32px));background:var(--ink);color:white;padding:14px 18px;border-radius:10px;z-index:10;border:1px solid #6D6159}
dialog{width:min(520px,calc(100vw - 32px));border:1px solid #E1D9D3;border-radius:14px;padding:24px}dialog::backdrop{background:rgba(30,22,18,.5)}dialog h2{margin-bottom:12px}dialog .actions{justify-content:flex-end;margin-top:22px}.list{padding-left:18px;color:var(--dim);font-size:13px}.list li{margin:10px 0}
.nav-list button{display:flex;align-items:center;gap:10px}.nav-list h4{margin:18px 12px 6px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#A99A91}.nav-list .avatar{width:28px;height:28px;font-size:10px}.nav-list .badge{padding:2px 6px}.icon{width:19px;height:19px;flex:none;vertical-align:middle}.side-foot .nav-list button{width:100%}.side-foot small{display:block}.topbar{padding:24px 28px 0;border-bottom:1px solid var(--line)}.topbar>.row{padding-bottom:20px;flex-wrap:wrap}.topbar h1{font-size:23px}.topbar .sub{font-size:12px}.topbar .tabs{margin:0;border:0;flex-wrap:wrap;gap:24px}.new{font-size:10px;color:#A9480A;background:var(--soft);padding:2px 5px;border-radius:4px;margin-left:5px}.hero{padding:28px;background:var(--muted);border-radius:12px;margin-bottom:24px}.hero h2{font-size:29px;letter-spacing:-.7px}.composer{border:1px solid var(--line);border-radius:10px;background:white;padding:16px;margin:20px 0}.composer .row{flex-wrap:wrap}.composer input{flex:1;min-width:140px}.composer #manual-url{width:auto;padding:10px;border:1px solid #E1D9D3;border-radius:7px}.composer .help{font-size:12px;color:var(--dim);margin-top:10px}.composer-options{padding-top:18px;border-top:1px solid var(--line);margin-top:16px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.fields .field{margin:0}.fields .span{grid-column:1/-1}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.tile{padding:18px;border:1px solid var(--line);border-radius:10px}.tile strong{display:block;font-size:28px}.tile span{color:var(--dim);font-size:12px}.chart{height:125px;display:flex;gap:12px;align-items:flex-end;padding:15px 12px;border-bottom:1px solid var(--line);margin:20px 0}.chart>span{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:10px}.chart>span:nth-child(even){background:var(--ink)}.job .row{flex-wrap:wrap}.job-head{margin-bottom:16px}.job-thumb{width:64px;height:48px;background:var(--muted);border-radius:6px;display:grid;place-items:center;flex:none}.job h2{font-size:17px}.job .clips{margin-top:18px}.job .poster{height:180px}.job .clip-body h3{font-size:14px}.job .clip-body .btn{font-size:12px;padding:7px 9px}.job .clip-body .actions{gap:6px}.progress{height:5px;background:var(--line);margin:20px 0 8px;border-radius:4px}.progress span{display:block;height:100%;background:var(--brand);width:38%}.live-preview{height:155px;background:#2C221D;color:#F4EEEA;display:grid;place-items:center;text-align:center;border-radius:8px;margin:18px 0}.live-preview small{color:#A99A91}.log-entry{display:grid;grid-template-columns:145px minmax(0,1fr);gap:18px;border-bottom:1px solid var(--line);padding:15px 0}.log-entry time{color:var(--dim);font-size:12px}.settings-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:24px}.settings-nav{display:grid;align-content:start;gap:8px}.settings-nav button{white-space:normal;text-align:left}.settings-nav .on{background:var(--soft);border-color:#FFD9BC}.feed-summary{border-color:#FFD9BC}.feed-summary .meta{margin-bottom:0}.clip-preview{display:block;width:100%;border:0;cursor:pointer}.sidebar .on .avatar{background:#FFE2CC}.body>.heading{display:none}.prototype .btn{font-size:12px}.feed .feed-foot .sub{flex:1;min-width:180px}
@media(max-width:1000px){.shell{grid-template-columns:180px minmax(0,1fr)}.body{padding:22px}.two{grid-template-columns:1fr}.meta{grid-template-columns:repeat(2,minmax(0,1fr))}.clips{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.shell{display:block}.sidebar{padding:14px 16px;gap:12px}.brand{font-size:21px}.sidebar>p,.sidebar h4{display:none}.nav-list{display:flex;flex-wrap:wrap;gap:4px}.nav-list button{padding:8px 10px;font-size:12px}main{margin:0 6px 6px;border-radius:12px}.prototype{padding:12px 16px;border-radius:12px 12px 0 0}.prototype label{margin-left:0}.body{padding:20px 16px}.heading{align-items:flex-start;flex-wrap:wrap}h1{font-size:24px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:24px}.stat small{font-size:11px}.feed{padding:16px}.feed>.row{align-items:flex-start;flex-wrap:wrap}.clips{grid-template-columns:1fr}.tabs{gap:14px}.meta{gap:12px}.btn{padding:8px 11px;font-size:13px}.toast{bottom:16px;right:16px}}
@media(max-width:1000px){.nav-list .badge{display:none}.job .clips{grid-template-columns:repeat(2,minmax(0,1fr))}.settings-layout{grid-template-columns:150px minmax(0,1fr)}}
@media(max-width:650px){.side-foot{display:block;margin-top:0;border:0;padding:0}.side-foot .nav-list{display:flex}.side-foot small{display:none}.side-foot .nav-list button{width:auto}.nav-list .avatar{width:22px;height:22px}.nav-list button{gap:6px}.nav-list h4{display:none}.topbar{padding:20px 16px 0}.topbar .tabs{gap:16px}.topbar h1{font-size:21px}.hero{padding:20px 16px}.hero h2{font-size:23px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.fields{grid-template-columns:1fr}.job .clips{grid-template-columns:1fr}.settings-layout{grid-template-columns:1fr}.settings-nav{display:flex;flex-wrap:wrap;gap:6px}.log-entry{grid-template-columns:1fr;gap:5px}.composer .actions{width:100%}.topbar .identity{min-width:0}.topbar .identity h1{overflow-wrap:anywhere}.prototype span{max-width:100%}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="brand">Peak<em>Cut</em></div>
  <nav class="nav-list" id="main-nav" aria-label="PeakCut navigation"></nav>
  <div class="side-foot"><nav class="nav-list" aria-label="AI and account"><button data-page="usage">AI usage <span class="badge">24 today</span></button><button data-page="settings"><span class="avatar">PC</span><span class="account-copy">Settings<small>AI key, connected apps</small></span></button><button data-action="notifications" aria-label="Notifications">Notifications <span class="badge">3</span></button></nav><small>Local-owner preview. Sign-in is off.</small></div>
</aside>
<main>
  <div class="prototype"><b>INTERACTIVE PROTOTYPE</b><span>Sample data only. Nothing downloads or publishes.</span>
    <label>Scenario <select id="scenario"><option value="active">Active feeds</option><option value="empty">First-time setup</option><option value="blocked">Waiting for space</option><option value="error">Feed unavailable</option></select></label>
    <button type="button" class="btn quiet" id="reset">Reset demo</button>
  </div>
  <header class="topbar" id="topbar"></header>
  <div class="body" id="content"></div>
</main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="confirm-dialog" aria-labelledby="dialog-title">
  <h2 id="dialog-title">Pause this feed?</h2><p id="dialog-copy"></p><div id="dialog-detail"></div>
  <div class="actions"><button type="button" class="btn" id="cancel-dialog">Cancel</button><button type="button" class="btn primary" id="accept-dialog">Confirm</button></div>
</dialog>
<script>
"use strict";
const $ = (selector) => document.querySelector(selector);
const channelA = "UC" + "A".repeat(22), channelB = "UC" + "B".repeat(22);
const demoVideos = [{id:"sample1",title:"Build a creative habit that lasts",date:"Today",length:"42 min"},{id:"sample2",title:"The overlooked part of good storytelling",date:"Yesterday",length:"28 min"},{id:"sample3",title:"What I learned from starting again",date:"3 days ago",length:"36 min"}];
let page = "overview", creatorTab = "clips", activeCreator = 1, feeds = [], runs = [], clips = [], scenario = "active", previewId = "", editingId = null, toastTimer, pendingConfirm, settingsTab = "ai", recording = true, postingPaused = false, manualQueued = null, creatorSettings = {};
const creators = [{id:1,name:"The Creative Notebook",initials:"CN"},{id:2,name:"Studio Conversations",initials:"SC"}];
function icon(name) {
  const paths={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16m10-16v16M3 9h4m10 0h4M3 15h4m10 0h4"/>',plus:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10m-5-5h10"/>'};
  return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">${paths[name]||paths.film}</svg>`;
}
function esc(value) { return String(value).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }
function badge(text, kind="") { return `<span class="badge ${kind}">${esc(text)}</span>`; }
function tell(text) { clearTimeout(toastTimer); $("#toast").textContent = text; $("#toast").hidden = false; toastTimer = setTimeout(() => { $("#toast").hidden = true; }, 6000); }
function seed(value) {
  scenario = value; previewId = ""; editingId = null; activeCreator = 1; recording = true; postingPaused = false; manualQueued = null; creatorSettings = {};
  feeds = value === "empty" ? [] : [
    {id:1,name:"The Creative Notebook",creator:"The Creative Notebook",creatorId:1,channel:channelA,status:value==="error"?"error":"active",checked:"12 minutes ago",next:"In 18 minutes",minutes:30,bootstrap:"new_only",message:value==="blocked"?"Storage is full. New videos stay waiting.":value==="error"?"YouTube did not respond. Next retry in 5 minutes.":""},
    {id:2,name:"Studio Conversations",creator:"Studio Conversations",creatorId:2,channel:channelB,status:"paused",checked:"Yesterday",next:"Paused",minutes:30,bootstrap:"new_only",message:""}
  ];
  runs = value === "empty" ? [] : [
    {id:1,feed:1,title:"Build a creative habit that lasts",time:"Today, 09:12",state:value==="blocked"?"waiting":"done",detail:value==="blocked"?"Waiting for storage space. No job submitted.":"3 clips ready for review",length:"42 min"},
    {id:2,feed:1,title:"The overlooked part of good storytelling",time:"Yesterday, 09:08",state:"error",detail:"Download interrupted. Retry is available.",length:"28 min"},
    {id:3,feed:1,title:"What I learned from starting again",time:"3 days ago",state:"baseline",detail:"Seen when the feed was added. Not automatically clipped.",length:"36 min"}
  ];
  clips = value==="empty"||value==="blocked" ? [] : [
    {id:1,title:"Make the habit smaller, not the ambition",seconds:38,score:92,state:"review"},
    {id:2,title:"The first ten minutes change everything",seconds:46,score:88,state:"review"},
    {id:3,title:"You do not need a perfect starting point",seconds:31,score:84,state:"review"}
  ];
  $("#scenario").value = value; creatorTab = "clips"; page = "overview"; render();
}
function heading(title, subtitle, action="") { return `<div class="heading"><div><div class="eyebrow">AUTOMATION / YOUTUBE UPLOADS</div><h1>${title}</h1><p class="sub">${subtitle}</p></div>${action}</div>`; }
function nav() {
  $(".side-foot").hidden=false;
  $("#main-nav").innerHTML=`<button data-page="overview">${icon("home")}<span class="label">Home</span></button><button data-page="library">${icon("film")}<span class="label">All videos</span>${badge("1 working")}</button><h4>Creators</h4>${creators.map(c=>`<button data-page="creator" data-creator="${c.id}"><span class="avatar">${c.initials}</span><span class="label">${esc(c.name)}</span>${c.id===2&&recording?badge("Rec","bad"):""}</button>`).join("")}<button data-action="new-creator">${icon("plus")}<span class="label">New creator</span></button>`;
  document.querySelectorAll(".sidebar [data-page]").forEach(button => { const active=button.dataset.page===page&&(page!=="creator"||Number(button.dataset.creator)===activeCreator); button.classList.toggle("on",active); if(active) button.setAttribute("aria-current","page"); else button.removeAttribute("aria-current"); });
}
function drawTopbar() {
  const c=creators.find(c=>c.id===activeCreator),isCreator=page==="creator";
  const titles={overview:"Home",library:"All videos",usage:"AI usage",settings:"Settings"};
  const subtitles={overview:`Good morning. ${creators.length} creators${recording?", 1 recording now":""}.`,library:"Every video and recording, across all creators.",usage:"What the AI has been used for.",settings:"Your AI key and connected apps."};
  $("#topbar").innerHTML=`<div class="row"><div class="identity">${isCreator?`<span class="avatar">${c.initials}</span>`:""}<div><h1>${esc(isCreator?c.name:titles[page])}</h1><p class="sub">${isCreator?(activeCreator===2&&recording?badge("Recording","bad"):badge("Offline")):subtitles[page]}</p></div></div><div class="actions">${isCreator?`<button class="btn ${activeCreator===2&&recording?"danger":"primary"}" data-action="record">${activeCreator===2&&recording?"Stop recording":"Start recording"}</button>`:["overview","library"].includes(page)?'<button class="btn" data-action="existing" data-message="This preview does not open external links.">Star on GitHub</button><button class="btn primary" data-action="existing" data-message="This preview does not open external links.">Follow me</button>':""}</div></div>${isCreator?`<nav class="tabs" role="tablist" aria-label="Creator sections">${["clips","setup","activity","feeds"].map(tab=>`<button role="tab" aria-selected="${creatorTab===tab}" class="${creatorTab===tab?"on":""}" data-tab="${tab}">${tab[0].toUpperCase()+tab.slice(1)}${tab==="feeds"?'<span class="new">NEW</span>':tab==="clips"?` ${badge(activeCreator===1?clips.length?2:1:1)}`:""}</button>`).join("")}</nav>`:""}`;
}
function composer(inCreator=false) {
  return `<section class="composer"><form id="manual-form"><div class="row"><input type="text" id="manual-url" aria-label="Video link" placeholder="Paste a YouTube, Twitch or Kick video link" required><button class="btn primary" type="submit">Make clips</button></div><div class="row" style="margin-top:12px"><div class="actions"><button type="button" class="btn" data-action="upload">Upload video</button>${inCreator?"":`<select class="btn" aria-label="File under creator" id="manual-creator"><option value="0">File under creator</option>${creators.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>`}<button type="button" class="btn" data-action="options" aria-expanded="false">Options</button></div><span class="help">or drop a video file here</span></div><div class="composer-options" id="composer-options" hidden><div class="fields">${selectField("Spoken language",["English","Arabic"])}${selectField("Max clips",["3","5","10"])}${selectField("Shortest clip",["20 seconds","30 seconds"])}${selectField("Longest clip",["60 seconds","90 seconds"])}${selectField("Layout",["Blurred fill","Zoomed","Crop","Left / right","Fit","Split","Gameplay"])}${selectField("Resolution",["1080p","720p"])}<label class="check"><input type="checkbox" checked>Generate captions</label>${selectField("Caption style",["Bold","Clean"])}<label class="field">Big text per clip<input type="text" placeholder="Optional"></label><label class="field">Description per clip<input type="text" placeholder="Optional"></label><label class="field">From (minutes)<input type="text" value="0"></label><label class="field">To (minutes)<input type="text" placeholder="End of video"></label></div></div></form></section>`;
}
function selectField(label,options,key="") {
  const saved=creatorSettings[activeCreator]?.[key];
  return `<label class="field">${label}<select class="field-input" ${key?`data-setting="${key}"`:""}>${options.map(o=>`<option ${o===saved?"selected":""}>${o}</option>`).join("")}</select></label>`;
}
function postQueue() {
  const scheduled=clips.filter(c=>c.state==="scheduled");
  return `<section class="panel"><div class="row"><div><h2>Post queue</h2><p class="sub">${postingPaused?"Paused. Recording and clipping carry on; nothing is posted.":"Queued clips go out at their scheduled time."}</p></div><button class="btn" data-action="pause-posting">${postingPaused?"Resume posting":"Pause all posting"}</button></div><div class="table-wrap"><table><thead><tr><th>When</th><th>Clip</th><th>Creator</th><th>Account</th><th>Action</th></tr></thead><tbody><tr><td>${badge("Tomorrow, 10:00")}</td><td>Let the conversation breathe</td><td>Studio Conversations</td><td>Sample YouTube account</td><td>Existing sample post</td></tr>${scheduled.map(c=>`<tr><td>${badge("Scheduled (sample)","good")}</td><td>${esc(c.title)} ${badge("Feed","orange")}</td><td>The Creative Notebook</td><td>Sample YouTube account</td><td><button class="btn" data-action="cancel-post" data-id="${c.id}">Cancel</button></td></tr>`).join("")}</tbody></table></div></section>`;
}
function stats() { return `<div class="stats"><div class="stat"><small>Active feeds</small><strong>${feeds.filter(f=>f.status!=="paused").length}</strong></div><div class="stat"><small>Waiting videos</small><strong>${runs.filter(r=>["waiting","queued"].includes(r.state)).length}</strong></div><div class="stat"><small>Clips to review</small><strong>${clips.filter(c=>c.state==="review").length}</strong></div></div>`; }

ap"><table><thead><tr><th>Creator</th><th>Status</th><th>Auto-post</th><th>Clips today</th><th>Posted today</th><th>Views</th></tr></thead><tbody>${creators.map(c=>`<tr><td><button class="btn quiet" data-page="creator" data-creator="${c.id}">${esc(c.name)}</button></td><td>${badge(c.id===2&&recording?"Recording":"Idle",c.id===2&&recording?"bad":"")}</td><td>${badge("On","good")}</td><td>${c.id===1?clips.length:2}</td><td>1</td><td>6,200</td></tr>`).join("")}</tbody></table></div></section>${postQueue()}`;

function jobHeader(title,meta,tag,action="") {

n><button class="btn" data-action="existing" data-message="Sample post editor only.">Post</button></div></div></article>`).join("")}</div></section>`:""}`;

eused by upload feeds.</p><div class="fields" style="margin-top:18px"><label class="check"><input type="checkbox" checked data-setting="captions">Generate captions</label>${selectField("Caption style",["Bold","Clean"],"style")}${selectField("Layout",["Blurred fill","Crop","Fit","Gameplay"],"layout")}${selectField("Shortest clip (seconds)",["20","30"],"min_len")}${selectField("Longest clip (seconds)",["60","90"],"max_len")}${selectField("Clips per video",["3","5"],"max_clips")}<label class="field">Big text on every clip<input type="text" placeholder="Left empty, the AI writes one for each clip"></label><label class="field">Description for every clip<input type="text" placeholder="Optional fixed description"></label></div></section><section class="panel"><h2>Posting</h2><p class="sub">Choose the accounts this creator's clips go to.</p><label class="check"><input type="checkbox" checked>Sample YouTube account</label><label class="check"><input type="checkbox" checked data-setting="autopost">Post new clips automatically</label><div class="fields">${selectField("Only auto-post clips scoring at least",["85","90"],"post_min_score")}${selectField("Minutes between posts on one account",["60","120"],"post_gap")}${selectField("Most posts per account per day",["3","5"],"daily_cap")}${selectField("Who can see posts",["Public","Unlisted","Private"],"privacy")}</div><div class="note warn" style="margin-top:20px;margin-bottom:0"><b>Feed exception (new):</b> review-first feed clips never use this automatic posting switch. Use their existing Post button to approve them.</div></section><div class="actions"><button class="btn primary" data-action="save-creator">Save changes</button><button class="btn" data-action="discard-creator">Discard</button></div><section class="panel" style="margin-top:24px"><h2>Delete this creator</h2><p class="sub">Removes their settings, videos and clips. Not available in this preview.</p><button class="btn danger" data-action="existing" data-message="No real function creator() {
  const owned=feeds.filter(f=>f.creatorId===activeCreator);
  let content = "";
  if(creatorTab==="clips") content=library(true);
  else if(creatorTab==="activity") content=creatorActivity();
  else if(creatorTab==="setup") content=creatorSetup();
  else content = `<div class="row" style="margin-bottom:20px"><div><h2>YouTube upload watching <span class="new">NEW</span></h2><p class="sub">Separate from live recording. Feed clips join this creator's existing library.</p></div><button class="btn primary" data-action="add" ${scenario==="blocked"?"disabled":""}>Add feed</button></div><div class="steps"><span class="on">New upload found</span><span>Existing clip job</span><span>Review in Clips</span><span>Existing Post queue</span></div>${owned.length?owned.map(feedCard).join(""):'<section class="empty"><h2>No upload feed for this creator yet</h2><p>Their live channels and recording settings still work. Add upload watching below.</p></section>'}${setupForm()}`;
  return content;
}

function activity(withHeading=true,feedId=null) {
  const items=runs.filter(r=>feedId===null||(Array.isArray(feedId)?feedId.includes(r.feed):r.feed===feedId));
  return (withHeading?heading("Feed activity","Every decision has a reason. Retries still respect your normal limits."):"")+
  `<div class="split filter"><label for="activity-filter">Show</label><select id="activity-filter" class="btn"><option value="all">All videos</option><option value="waiting">Waiting / queued</option><option value="error">Needs attention</option><option value="done">Clips ready</option><option value="baseline">Baseline / skipped</option></select></div>
  <div class="panel table-wrap" style="padding:0"><table><thead><tr><th>Video</th><th>Discovered</th><th>State and reason</th><th>Action</th></tr></thead><tbody id="activity-rows">${items.map(r=>`<tr data-state="${r.state}"><td class="activity-title"><b>${esc(r.title)}</b><small>${r.length} / ${esc(feeds.find(f=>f.id===r.feed)?.name||"Removed feed")}</small></td><td>${esc(r.time)}</td><td>${badge(({done:"Clips ready",error:"Failed",waiting:"Waiting",queued:"Queued",baseline:"Baseline"})[r.state]||r.state,r.state==="done"?"good":r.state==="error"?"bad":"")}<small>${esc(r.detail)}</small></td><td>${r.state==="done"?'<button class="btn" data-action="review-clips">Open in Clips</button>':r.state==="error"?`<button class="btn" data-action="retry" data-id="${r.id}">Retry video</button>`:r.state==="baseline"?`<button class="btn" data-action="backfill" data-id="${r.id}">Choose for clipping</button>`:'<span class="sub">No action needed</span>'}</td></tr>`).join("")||'<tr><td colspan="4">No videos discovered yet. Add a feed to begin.</td></tr>'}</tbody></table></div>
  <div class="note">Pausing or removing a feed does not delete its clips. Deleting a job must not cause that upload to be automatically submitted again.</div>`;
}
function review(withHeading=true) {

  (clips.length?`<div class="clips">${clips.map(c=>`<article class="clip"><button class="poster clip-preview" data-action="existing" data-message="This would open PeakCut's existing clip editor. Sample video only." aria-label="Open clip: ${esc(c.title)}"><span class="poster-inner"><b>${esc(c.title)}</b><small>9:16 wireframe<br>${c.seconds} seconds / score ${c.score}<br>Not a real video</small></span></button><div class="clip-body">${badge(c.state==="review"?"Needs review":c.state==="kept"?"Kept for later":"Scheduled (sample)",c.state==="scheduled"?"good":"orange")}<h3>${esc(c.title)}</h3><p>Sample score ${c.score} / English captions</p><div class="actions"><button class="btn quiet" data-action="existing" data-message="Sample download only. No media file exists.">Download</button><button class="btn quiet" data-action="existing" data-message="Sample post text is shown; the clipboard is not changed.">Copy post text</button><button class="btn" data-action="schedule" data-id="${c.id}" ${c.state==="scheduled"?"disabled":""}>${c.state==="scheduled"?"Scheduled":"Post"}</button><button class="btn quiet" data-action="keep" data-id="${c.id}" ${c.state!=="review"?"disabled":""}>Keep for later</button></div></div></article>`).join("")}</div>`:`<div class="empty"><h2>No finished feed clips yet</h2><p>When a feed video finishes, clips appear in this existing library.</p><button class="btn" data-action="open-activity" data-creator="1">See Activity</button></div>`);
}
function render() { nav(); drawTopbar(); $("#content").innerHTML = (scenario==="blocked"&&page!=="settings"?'<div class="note warn"><b>The drive PeakCut saves to is almost full, so it cannot take new videos.</b> <button class="btn" data-action="open-storage">Open Storage</button></div>':"")+(page==="overview"?home():page==="creator"?creator():page==="library"?library():page==="settings"?settings():usage()); const edit=feeds.find(f=>f.id===editingId); if(page==="creator"&&creatorTab==="feeds"&&edit) $("#analysis-minutes").value=edit.minutes; if(page==="creator"&&creatorTab==="setup") document.querySelectorAll("[data-setting]").forEach(input=>{const saved=creatorSettings[activeCreator]?.[input.dataset.setting];if(saved!==undefined) {if(input.type==="checkbox")input.checked=saved;else input.value=saved;}}); }
function confirm(title,copy,callback) { pendingConfirm=callback; $("#dialog-title").textContent=title; $("#dialog-copy").textContent=copy; $("#dialog-detail").innerHTML=""; $("#accept-dialog").textContent="Confirm"; $("#confirm-dialog").showModal(); }
function parseChannel(value) {
  if(/^UC[A-Za-z0-9_-]{22}$/.test(value)) return value;
  try {
    const url=new URL(value);
    if(url.protocol!=="https:"||!["www.youtube.com","youtube.com"].includes(url.hostname)||url.username||url.password||url.port||url.hash) return "";
    if(url.pathname==="/feeds/videos.xml"&&Array.from(url.searchParams.keys()).length===1) { const id=url.searchParams.get("channel_id"); return /^UC[A-Za-z0-9_-]{22}$/.test(id||"")?id:""; }
    const match=url.pathname.match(/^\/channel\/(UC[A-Za-z0-9_-]{22})\/?$/); return match&&!url.search?match[1]:"";
  } catch(error) { if(!(error instanceof TypeError)) throw error; return ""; }
}
function preview() {
  const id=parseChannel($("#channel-input").value.trim()); previewId="";
  if(!id) { $("#form-error").textContent="Enter a canonical YouTube channel ID, channel URL, or HTTPS channel feed URL. Handles and other hosts are not supported in this sample."; $("#form-error").hidden=false; $("#feed-preview").hidden=true; return; }
  previewId=id; $("#form-error").hidden=true; $("#feed-preview").hidden=false; $("#feed-preview").className="preview";
  $("#feed-preview").innerHTML=`<div class="identity"><span class="avatar">YT</span><div><b>Sample channel preview</b><p class="sub">3 sample recent uploads / no network request</p></div></div><div class="feed-url">${esc("https://www.youtube.com/feeds/videos.xml?channel_id="+id)}</div>`;
}
document.addEventListener("click",event=>{
  const button=event.target.closest("button"); if(!button||button.disabled) return;
  if(button.dataset.page) { page=button.dataset.page; if(page==="creator"){activeCreator=Number(button.dataset.creator)||activeCreator;creatorTab="clips";editingId=null;} render(); return; }
  if(button.dataset.tab) { creatorTab=button.dataset.tab; editingId=null; render(); return; }
  if(button.dataset.settingsTab) {settingsTab=button.dataset.settingsTab;render();return;}
  const action=button.dataset.action,id=Number(button.dataset.id),feed=feeds.find(f=>f.id===id);
  if(action==="existing") tell(button.dataset.message);
  if(action==="open-feeds"||action==="open-activity") {activeCreator=Number(button.dataset.creator)||activeCreator;page="creator";creatorTab=action==="open-feeds"?"feeds":"activity";editingId=null;render();}
  if(action==="review-clips") {creatorTab="clips";render();$("#feed-job")?.scrollIntoView({block:"start"});}
  if(action==="open-storage") {page="settings";settingsTab="storage";render();}
  if(action==="notifications") {confirm("Notifications (sample)","Existing notifications remain available. Feed completion and failures can join them.",()=>{});$("#dialog-detail").innerHTML='<div class="preview">3 feed clips are ready for review.<br>A download needs attention.<br>Studio Conversations started recording.</div>';}
  if(action==="new-creator") {confirm("New creator","The existing creator workspace is still the place to add stream and clip settings. This sample does not create a real creator.",()=>tell("Sample creator dialog only. No production data changed."));$("#dialog-detail").innerHTML='<label class="field" style="margin-top:16px">Name<input type="text" placeholder="Creator name"></label>';}
  if(action==="record") {confirm(activeCreator===2&&recording?"Stop sample recording?":"Start sample recording?","Live recording is independent of upload feed polling. This only changes a sample status.",()=>{if(activeCreator===2)recording=!recording;render();tell(activeCreator===2?"Sample recording status changed. Upload feeds were not changed.":"Sample start requested. No live stream or job is opened.");});}
  if(action==="options") {const options=$("#composer-options");options.hidden=!options.hidden;button.setAttribute("aria-expanded",String(!options.hidden));}
  if(action==="upload") confirm("Upload video","Existing upload stays beside paste-link clipping. No file is read or uploaded in this prototype.",()=>tell("Sample upload only. No file was read."));
  if(action==="pause-posting") {postingPaused=!postingPaused;render();tell("Sample posting queue "+(postingPaused?"paused":"resumed")+". Feed polling and live recording are unchanged.");}
  if(action==="cancel-post") {clips.find(c=>c.id===id).state="review";render();tell("Sample schedule cancelled. The clip stays in its existing library.");}
  if(action==="save-creator") {const values={};document.querySelectorAll("[data-setting]").forEach(input=>{values[input.dataset.setting]=input.type==="checkbox"?input.checked:input.value;});creatorSettings[activeCreator]=values;tell("Sample creator settings saved. Review-first feed clips still cannot autopost.");}
  if(action==="discard-creator") {render();tell("Unsaved sample setting changes discarded.");}
  if(action==="details") { activeCreator=feed.creatorId;editingId=id; page="creator"; creatorTab="feeds"; render(); }
  if(action==="cancel-edit") { editingId=null; render(); }
  if(action==="demo-input") { $("#channel-input").value=channelA; previewId=""; tell("Sample ID entered. Preview it before starting."); }
  if(action==="preview") preview();
  if(action==="pause") confirm("Pause this feed?","No new clip jobs will be submitted. Jobs already queued or running will continue, and your clips stay in the library.",()=>{feed.status="paused";feed.next="Paused";render();tell("Sample feed paused. Existing clips are unchanged.");});
  if(action==="resume") { feed.status="active";feed.next="In 30 minutes";feed.message="";render();tell("Sample feed resumed. Only uploads still available in RSS can be caught up."); }
  if(action==="check") {
    if(scenario==="error") {feed.checked="Just now";feed.message="Sample timeout: YouTube did not respond. Retrying in 5 minutes.";feed.next="Retry in 5 minutes";render();tell("Simulated feed error. Existing history is safe.");return;}
    feed.checked="Just now";feed.next="In 30 minutes";
    if(runs.some(r=>r.title==="A better way to finish your projects"&&r.feed===id)) {render();tell("Sample check complete: no new uploads. The known video was not added twice.");return;}
    runs.unshift({id:Date.now(),feed:id,title:"A better way to finish your projects",time:"Just now",state:"waiting",detail:scenario==="blocked"?"Storage is full. Waiting before submission.":"Today's feed allowance is used. Eligible for the next slot.",length:"35 min"});render();tell("Sample new upload discovered and saved as waiting. No real job started.");
  }
  if(action==="retry"||action==="backfill") {
    const run=runs.find(r=>r.id===id),ownerFeed=feeds.find(f=>f.id===run.feed);
    if(!ownerFeed||ownerFeed.status==="paused") {tell("Resume this feed before choosing or retrying a video.");return;}
    confirm(action==="retry"?"Retry this video?":"Include this baseline video?","This requests clipping through the existing queue. Capacity and the daily feed allowance still apply.",()=>{run.state="waiting";run.detail=scenario==="blocked"?"Waiting for storage space.":"Explicitly selected. Waiting for the next daily allowance.";render();tell("Sample request saved. No real job was created.");});
  }
  if(action==="keep") {clips.find(c=>c.id===id).state="kept";render();tell("Sample clip kept in the library without publishing.");}
  if(action==="schedule") {confirm("Post clip - existing posting controls","Feed review opens the same connected-account posting flow. This demo records only a sample schedule, never a publication.",()=>{clips.find(c=>c.id===id).state="scheduled";render();tell("Sample schedule recorded in Home's Post queue. This is not confirmed publication.");});$("#dialog-detail").innerHTML=`<div class="preview"><b>${esc(clips.find(c=>c.id===id).title)}</b>${selectField("Account",["Sample YouTube account"])}<label class="field" style="margin-top:16px">When<input type="text" value="Tomorrow, 10:00 (sample)" readonly></label><p class="sub">No real account or publishing request.</p></div>`;$("#accept-dialog").textContent="Schedule sample";}
});
document.addEventListener("change",event=>{
  if(event.target.id==="scenario") seed(event.target.value);
  if(event.target.name==="bootstrap") $("#backlog").hidden=event.target.value!=="selected";
  if(event.target.id==="activity-filter") {const value=event.target.value;document.querySelectorAll("#activity-rows tr[data-state]").forEach(row=>{const state=row.dataset.state;row.hidden=value!=="all"&&!(value==="waiting"?["waiting","queued"].includes(state):state===value);});}
});
document.addEventListener("input",event=>{if(event.target.id==="channel-input"){previewId="";$("#feed-preview").hidden=true;}});
document.addEventListener("submit",event=>{
  if(event.target.id==="manual-form") {event.preventDefault();if(scenario==="blocked"){tell("Storage is full. Manual videos and feed videos use the same admission gate.");return;}manualQueued={url:$("#manual-url").value,creatorId:page==="creator"?activeCreator:Number($("#manual-creator").value)};tell("Manual sample video added. No download or real job started.");render();return;}
  if(event.target.id!=="feed-form") return; event.preventDefault();
  const id=parseChannel($("#channel-input").value.trim()),error=$("#form-error");
  if(!id||previewId!==id) {error.textContent="Preview this channel before starting or saving.";error.hidden=false;return;}
  const duplicate=feeds.find(f=>f.channel===id&&f.id!==editingId);
  if(duplicate) {error.textContent=`This sample channel is already attached to ${duplicate.creator}. Manage its existing feed instead.`;error.hidden=false;return;}
  const bootstrap=$('input[name="bootstrap"]:checked').value,chosen=Array.from(document.querySelectorAll('input[name="backlog"]:checked'));
  if(chosen.length>3) {error.textContent="Choose up to 3 recent videos.";error.hidden=false;return;}
  if(bootstrap==="selected"&&!chosen.length) {error.textContent="Choose at least one recent video, or use New uploads only.";error.hidden=false;return;}
  const existing=feeds.find(f=>f.id===editingId);
  const owner=creators.find(c=>c.id===activeCreator);
  const feed=existing||{id:Date.now(),name:"Sample channel",creator:owner.name,creatorId:owner.id,channel:id,status:"active",checked:"Just now",next:"In 30 minutes",message:""};
  feed.channel=id;feed.minutes=Number($("#analysis-minutes").value);feed.bootstrap=bootstrap;
  if(!existing) {
    feeds.push(feed);
    demoVideos.forEach(v=>runs.push({id:Date.now()+runs.length+1,feed:feed.id,title:v.title,time:"First check",state:bootstrap==="selected"&&chosen.some(input=>input.value===v.id)?"waiting":"baseline",detail:bootstrap==="selected"&&chosen.some(input=>input.value===v.id)?"Selected backlog. Waiting for daily allowance.":"Initial baseline. Not automatically clipped.",length:v.length}));
  }
  editingId=null;page="creator";creatorTab="feeds";render();tell(existing?"Sample settings saved. Existing jobs are unchanged.":"Sample feed added to this creator. Baseline recorded; no real RSS was fetched.");
});
document.addEventListener("dragover",event=>event.preventDefault());
document.addEventListener("drop",event=>{event.preventDefault();tell("File drop is sample-only. No file was read or uploaded.");});
$("#reset").addEventListener("click",()=>{seed("active");tell("Sample data reset.");});
$("#cancel-dialog").addEventListener("click",()=>{$("#confirm-dialog").close();pendingConfirm=null;});
$("#accept-dialog").addEventListener("click",()=>{const callback=pendingConfirm;pendingConfirm=null;$("#confirm-dialog").close();if(callback)callback();});
$("#confirm-dialog").addEventListener("cancel",()=>{pendingConfirm=null;});
seed("active");
</script>
</body>
</html>
